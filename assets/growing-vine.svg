<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vineGradientCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="50%" stop-color="#F0DDB0"/>
      <stop offset="100%" stop-color="#D9B98C"/>
    </linearGradient>
    <filter id="glowCream" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!--
    مسیر: از بالای بالا (وسط تیتر Hi, I'm Arvin Siz10) شروع میشه،
    یه کمان روی سرِ تیتر و گیف دایره‌ای می‌زنه (سمت راست بالا)،
    بعد به صورت مارپیچ میاد پایین تا انتهای صفحه.
    خط با dasharray پاره‌پاره‌ست (نه یک‌دست) و هر جا break می‌خوره یه دایره می‌ذاریم.
  -->
  <path id="vinePath"
        d="M450,4
           C580,-2 650,25 720,20
           C790,15 840,50 850,90
           C860,130 810,150 800,190
           C790,230 850,250 850,300
           C850,350 780,360 770,400
           C760,440 830,450 830,500
           C830,550 750,560 740,600
           C730,630 650,640 620,646"
        fill="none"
        stroke="url(#vineGradientCream)"
        stroke-width="4"
        stroke-linecap="round"
        filter="url(#glowCream)"
        pathLength="1000"
        stroke-dasharray="26 14"
        stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset"
             from="1000" to="0"
             dur="4s"
             begin="0s"
             fill="freeze"
             calcMode="spline"
             keySplines="0.25 0.1 0.25 1"/>
  </path>

  <!-- دایره‌های کرمی/طلایی روی نقاط شکست خط، هماهنگ با پیشروی رسم -->
  <g filter="url(#glowCream)">
    <circle cx="720" cy="20" r="0" opacity="0" fill="#FFF6E0">
      <animate attributeName="r" from="0" to="6" begin="0.25s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="850" cy="90" r="0" opacity="0" fill="#F0DDB0">
      <animate attributeName="r" from="0" to="6" begin="0.7s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="800" cy="190" r="0" opacity="0" fill="#E8C39E">
      <animate attributeName="r" from="0" to="6" begin="1.35s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="850" cy="300" r="0" opacity="0" fill="#FFF6E0">
      <animate attributeName="r" from="0" to="6" begin="2.0s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="770" cy="400" r="0" opacity="0" fill="#D9B98C">
      <animate attributeName="r" from="0" to="6" begin="2.65s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="830" cy="500" r="0" opacity="0" fill="#F0DDB0">
      <animate attributeName="r" from="0" to="6" begin="3.3s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.35s" fill="freeze"/>
    </circle>
    <circle cx="740" cy="600" r="0" opacity="0" fill="#FFF6E0">
      <animate attributeName="r" from="0" to="6" begin="3.8s" dur="0.35s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.35s" fill="freeze"/>
    </circle>
  </g>

  <!-- نقطه‌ی درخشان نوکِ در حال رشد که کل مسیر رو دنبال می‌کنه -->
  <circle r="4.5" fill="#FFFDF5" filter="url(#glowCream)">
    <animateMotion dur="4s" fill="freeze" calcMode="spline"
                   keySplines="0.25 0.1 0.25 1"
                   path="M450,4
                         C580,-2 650,25 720,20
                         C790,15 840,50 850,90
                         C860,130 810,150 800,190
                         C790,230 850,250 850,300
                         C850,350 780,360 770,400
                         C760,440 830,450 830,500
                         C830,550 750,560 740,600
                         C730,630 650,640 620,646"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.92;1" dur="4s" fill="freeze"/>
  </circle>
</svg>
